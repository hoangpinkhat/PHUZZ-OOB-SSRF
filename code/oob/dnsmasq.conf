# dnsmasq configuration for the PHUZZ OOB service
#
# Resolve every *.oob hostname to the OOB container's own IP (172.20.0.10).
# The web container is configured (via docker-compose dns:) to use this
# dnsmasq instance as its nameserver, so SSRF payloads of the form
#   http://<token>.oob:8000/
# are always directed back to this container.

# Listen on all interfaces inside the container
listen-address=0.0.0.0

# Do not forward plain (non-FQDN) queries to upstream DNS
domain-needed
bogus-priv

# Wildcard: any label.oob → OOB container fixed IP
address=/.oob/172.20.0.10

# Forward everything else to Google's public DNS
server=8.8.8.8
