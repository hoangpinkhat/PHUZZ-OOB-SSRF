[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

; ── dnsmasq ────────────────────────────────────────────────────────────────
; Resolves *.oob → 172.20.0.10 (this container's fixed IP on phuzz-net).
; The web container's /etc/resolv.conf nameserver is pointed here via the
; docker-compose `dns:` key.

[program:dnsmasq]
command=dnsmasq --no-daemon --conf-file=/etc/dnsmasq.conf
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; ── OOB HTTP listener ───────────────────────────────────────────────────────
; Accepts any HTTP request on port 8000 and writes
; /shared-tmpfs/oob-logs/<token>.json when the Host header contains ".oob".

[program:oob_listener]
command=python3 /app/oob_listener.py
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
