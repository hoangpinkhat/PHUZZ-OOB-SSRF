name: phuzz-bwapp-rfi-baseline

# bWAPP Remote File Inclusion → SSRF
# Baseline: original PHUZZ — no SSRFMutator, no SSRFVulnCheck, no OOB listener.
# Used to demonstrate that vanilla PHUZZ cannot detect SSRF via RFI.

services:

  phuzz-db:
    image: mysql:8
    command: mysqld
    environment:
      MYSQL_DATABASE:      db
      MYSQL_USER:          user
      MYSQL_PASSWORD:      password
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST:     "%"
    networks:
      phuzz-net:
        aliases: [db]

  phuzz-web:
    build:
      context: ../web
      dockerfile: Dockerfile
    environment:
      APPLICATION_TYPE:     bwapp
      FUZZER_COVERAGE_PATH: /var/www/html/
      FUZZER_COMPRESS:      0
      REQUIRES_DB:          1
    volumes:
      - ../web/applications:/applications/
      - shared-tmpfs:/shared-tmpfs
    ports:
      - "8083:80"
    networks:
      phuzz-net:
        aliases: [web]
    depends_on: [phuzz-db]
    healthcheck:
      test: ["CMD", "test", "-f", "/shared-tmpfs/web-paths.txt"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  phuzz-fuzzer-1:
    build:
      context: ../fuzzer
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: 1
      FUZZER_NODE_ID:   1
      FUZZER_CONFIG:    bwapp/rlfi_ssrf
      FUZZER_CLEANUP:   1
      FUZZER_COMPRESS:  0
      FUZZER_NO_SSRF:   1        # disable SSRFMutator + SSRFVulnCheck
    volumes:
      - ../fuzzer:/app
      - ../fuzzer/output-baseline:/app/output
      - shared-tmpfs:/shared-tmpfs
      - sync-tmpfs:/sync-tmpfs
    depends_on:
      phuzz-web:
        condition: service_healthy
    networks: [phuzz-net]

volumes:
  shared-tmpfs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=512m,uid=1000"
  sync-tmpfs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=256m,uid=1000"

networks:
  phuzz-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
