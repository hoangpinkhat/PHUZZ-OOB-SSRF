name: phuzz-mutillidae-rfi

# Mutillidae II — Remote File Inclusion → SSRF
# Security level: 0 (no protection — include() with raw user input)
# Endpoint: GET /index.php?page=<payload>
# Vulnerable code: require_once($lPage)  (at security level 0)
#
# Detection: PHP stream wrapper 09_ssrf_stream.php intercepts include/require_once
# of http:// URLs → logs to ssrf-hooks/<covID>.json → SSRFVulnCheck matches OOB

services:

  phuzz-oob:
    build:
      context: ./oob
      dockerfile: Dockerfile
    volumes:
      - shared-tmpfs:/shared-tmpfs
    networks:
      phuzz-net:
        ipv4_address: 172.20.0.10

  phuzz-db:
    image: mysql:8
    command: mysqld
    environment:
      MYSQL_DATABASE:      mutillidae
      MYSQL_ROOT_PASSWORD: mutillidae
      MYSQL_ROOT_HOST:     "%"
    networks:
      phuzz-net:
        aliases: [db]

  phuzz-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      APPLICATION_TYPE:     mutillidae
      FUZZER_COVERAGE_PATH: /var/www/html/
      FUZZER_COMPRESS:      0
      REQUIRES_DB:          1
    volumes:
      - ./web/applications:/applications/
      - shared-tmpfs:/shared-tmpfs
    ports:
      - "8084:80"
    dns:
      - 172.20.0.10
    extra_hosts:
      - "oob.phuzz:172.20.0.10"
    networks:
      phuzz-net:
        aliases: [web]
    depends_on: [phuzz-db, phuzz-oob]
    healthcheck:
      test: ["CMD", "test", "-f", "/shared-tmpfs/web-paths.txt"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s

  phuzz-fuzzer-1:
    build:
      context: ./fuzzer
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: 1
      FUZZER_NODE_ID:   1
      FUZZER_CONFIG:    mutillidae/rfi_ssrf
      FUZZER_CLEANUP:   1
      FUZZER_COMPRESS:  0
    volumes:
      - ./fuzzer:/app
      - shared-tmpfs:/shared-tmpfs
      - sync-tmpfs:/sync-tmpfs
    depends_on:
      phuzz-web:
        condition: service_healthy
      phuzz-oob:
        condition: service_started
    networks: [phuzz-net]

volumes:
  shared-tmpfs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=512m,uid=1000"
  sync-tmpfs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=256m,uid=1000"

networks:
  phuzz-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
