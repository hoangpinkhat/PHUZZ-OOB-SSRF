# docker-compose.ssrf.yml
#
# PHUZZ SSRF fuzzing environment
#
# Services
# --------
#   phuzz-oob     – OOB DNS + HTTP listener  (172.20.0.10)
#   phuzz-db      – MySQL database backend
#   phuzz-web     – Instrumented PHP web application
#   phuzz-fuzzer  – PHUZZ fuzzer with SSRFMutator + SSRFVulnCheck
#
# Shared volumes
# --------------
#   shared-tmpfs  – communication channel between fuzzer, web, and OOB
#                   sub-directories used:
#                     /shared-tmpfs/ssrf-hooks/   (PHP hook logs)
#                     /shared-tmpfs/oob-logs/     (OOB callback logs)
#   sync-tmpfs    – inter-fuzzer candidate synchronisation
#
# Network
# -------
#   phuzz-net uses a fixed 172.20.0.0/24 subnet so the OOB container can be
#   given a stable IP (172.20.0.10).  The web container is configured to use
#   that IP as its DNS server so that *.oob resolves to the OOB listener.
#
# Usage
# -----
#   docker compose -f docker-compose.ssrf.yml up --build

name: phuzz-ssrf

services:

  # --------------------------------------------------------------------------
  # phuzz-oob
  # --------------------------------------------------------------------------
  # Runs two processes via supervisord:
  #   1. dnsmasq  – resolves *.oob → 172.20.0.10
  #   2. Flask    – HTTP listener on port 8000 that records OOB callbacks
  #
  # The shared-tmpfs volume is mounted so oob_listener.py can write to
  # /shared-tmpfs/oob-logs/ directly, which the fuzzer reads via isfile().
  # --------------------------------------------------------------------------
  phuzz-oob:
    build:
      context: ./oob
      dockerfile: Dockerfile
    volumes:
      - shared-tmpfs:/shared-tmpfs
    ports:
      - "8000:8000"
    networks:
      phuzz-net:
        ipv4_address: 172.20.0.10

  # --------------------------------------------------------------------------
  # phuzz-db
  # --------------------------------------------------------------------------
  phuzz-db:
    image: mysql:8
    command: mysqld
    environment:
      MYSQL_DATABASE:      db
      MYSQL_USER:          user
      MYSQL_PASSWORD:      password
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST:     "%"
      MYSQL_USER_HOST:     "%"
    networks:
      phuzz-net:
        aliases:
          - db          # entrypoint.sh + XVWA config.php both connect to hostname "db"

  # --------------------------------------------------------------------------
  # phuzz-web
  # --------------------------------------------------------------------------
  # Standard PHUZZ web container with one addition:
  #   - dns: [172.20.0.10]  makes the container use phuzz-oob as its nameserver
  #     so that *.oob hostnames inside SSRF payloads resolve correctly.
  #
  # The 08_ssrf.php hook is already part of the image because
  # instrumentation/overrides.d/ is copied into the image via the web
  # Dockerfile (COPY ./instrumentation/ /var/www/fuzzer/).
  # --------------------------------------------------------------------------
  phuzz-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      APPLICATION_TYPE:      xvwa
      FUZZER_COVERAGE_PATH:  /var/www/html/xvwa/
      FUZZER_COMPRESS:       0
      REQUIRES_DB:           1
    volumes:
      - ./web/applications:/applications/
      - shared-tmpfs:/shared-tmpfs
    ports:
      - "8080:80"
    dns:
      - 172.20.0.10          # resolve *.oob via phuzz-oob dnsmasq
    networks:
      phuzz-net:
        aliases:
          - web              # fuzzer config targets "http://web/..."
    depends_on:
      - phuzz-db
      - phuzz-oob
    # web-paths.txt is written at the END of entrypoint.sh (after rsync + find).
    # The fuzzer reads this file at startup; healthcheck ensures it exists first.
    healthcheck:
      test: ["CMD", "test", "-f", "/shared-tmpfs/web-paths.txt"]
      interval: 5s
      timeout: 3s
      retries: 60          # wait up to 5 min for slow rsync (large vendor/ dirs)
      start_period: 10s

  # --------------------------------------------------------------------------
  # phuzz-fuzzer
  # --------------------------------------------------------------------------
  # Uses the standard fuzzer image.  To activate SSRFMutator and SSRFVulnCheck
  # the fuzzer.py must be edited to include them:
  #
  #   from ssrf_mutator  import SSRFMutator
  #   from ssrf_vulncheck import SSRFVulnCheck
  #
  #   # In DefaultMutator.__init__:
  #   self.param_mutators.append(SSRFMutator())
  #
  #   # In ParamBasedVulnChecker.__init__:
  #   self.vuln_checkers.append(SSRFVulnCheck())
  #
  # The FUZZER_CONFIG environment variable points to the target endpoint
  # config (e.g. bwapp/ssrf).
  # --------------------------------------------------------------------------
  phuzz-fuzzer:
    build:
      context: ./fuzzer
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: 1
      FUZZER_NODE_ID:   1
      FUZZER_CONFIG:    xvwa/ssrf
      FUZZER_CLEANUP:   1
      FUZZER_COMPRESS:  0
    volumes:
      - ./fuzzer:/app
      - shared-tmpfs:/shared-tmpfs
      - sync-tmpfs:/sync-tmpfs
    depends_on:
      phuzz-web:
        condition: service_healthy   # wait until web-paths.txt exists
      phuzz-oob:
        condition: service_started
    networks:
      - phuzz-net

# ----------------------------------------------------------------------------
# Volumes
# ----------------------------------------------------------------------------
volumes:
  shared-tmpfs:
    driver: local
    driver_opts:
      type:   tmpfs
      device: tmpfs
      o:      "size=512m,uid=1000"

  sync-tmpfs:
    driver: local
    driver_opts:
      type:   tmpfs
      device: tmpfs
      o:      "size=256m,uid=1000"

# ----------------------------------------------------------------------------
# Networks
# ----------------------------------------------------------------------------
networks:
  phuzz-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
